name: Validate content

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate every item (fails on errors)
        run: node scripts/build-index.mjs --check

      - name: Warn if index.json was edited by hand
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qx 'index.json'; then
            echo "::warning file=index.json::index.json is generated automatically after merge. Please drop your changes to it from this pull request."
          fi
